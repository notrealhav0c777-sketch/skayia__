<!DOCTYPE html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SKAY.IA</title>
<style>*{box-sizing:border-box}body{margin:0;height:100vh;display:flex;flex-direction:column;background:#07070c;color:#e4e4ee;font:15px/1.55 system-ui,sans-serif}
header{padding:12px 18px;border-bottom:1px solid #1d1d2b}h1{margin:0;font-size:22px;letter-spacing:4px;background:linear-gradient(90deg,#7c5cff,#19c37d,#d97757);-webkit-background-clip:text;color:transparent}
#chat{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:14px}.m{max-width:820px;padding:12px 16px;border-radius:12px;word-wrap:break-word}.u{align-self:flex-end;background:#2a2260}.a{background:#12121d;border:1px solid #232336}
details{margin-top:10px;font-size:13px}summary{cursor:pointer;color:#9a8cff}.box{background:#0b0b14;border:1px solid #232336;border-radius:8px;padding:8px 10px;margin:6px 0}
pre{background:#000;padding:10px;border-radius:8px;overflow:auto}code{background:#000;padding:1px 5px;border-radius:4px}
form{display:flex;gap:8px;padding:12px 18px;border-top:1px solid #1d1d2b}textarea{flex:1;background:#0f0f1a;color:inherit;border:1px solid #2c2c44;border-radius:8px;padding:10px;font:inherit;resize:none;height:48px}
button{background:#181826;color:#e4e4ee;border:1px solid #2c2c44;border-radius:8px;padding:8px 18px;cursor:pointer;font:inherit}button:hover{border-color:#7c5cff}</style></head><body>
<header><h1>SKAY.IA</h1></header>
<div id="chat"><div class="m a">Olá! Eu sou a <b>SKAY.IA</b>. Uso o ChatGPT e o Claude como fontes e respondo com uma mente só. Não precisa fazer login em nada.</div></div>
<form id="f"><textarea id="q" placeholder="Pergunte alguma coisa... (Enter envia)"></textarea><button>Enviar</button></form>
<script>
const $=i=>document.getElementById(i);let H=[];
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const md=s=>esc(s).replace(/```\w*\n([\s\S]*?)```/g,'<pre>$1</pre>').replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>');
const add=(c,h)=>{const d=document.createElement('div');d.className='m '+c;d.innerHTML=h;$('chat').append(d);$('chat').scrollTop=1e9;return d};
const J=async r=>{const t=await r.text();try{return JSON.parse(t)}catch(e){return{error:'O servidor respondeu vazio ou inválido (status '+r.status+'). A pasta api provavelmente não foi publicada, ou a função deu timeout.'}}};
async function send(q){H.push({role:'user',content:q});const b=add('a','<i>Pensando com as duas fontes...</i>');
try{let r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json','x-code':localStorage.getItem('skcode')||''},body:JSON.stringify({messages:H.slice(-10)})});let j=await J(r);
if(r.status==401&&j.needCode){const c=prompt('Código de acesso da SKAY.IA:');if(c){localStorage.setItem('skcode',c);r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json','x-code':c},body:JSON.stringify({messages:H.slice(-10)})});j=await J(r)}}
if(!r.ok||j.error)throw Error(j.error||r.status);H.push({role:'assistant',content:j.answer});
b.innerHTML=md(j.answer)+(j.drafts?'<details><summary>Ver as duas fontes</summary><div class="box"><b>ChatGPT:</b><br>'+md(j.drafts.chatgpt)+'</div><div class="box"><b>Claude:</b><br>'+md(j.drafts.claude)+'</div></details>':'<div style="font-size:12px;opacity:.6;margin-top:8px">Só uma fonte respondeu desta vez.</div>')}
catch(e){H.pop();b.innerHTML='<b>Erro:</b> '+esc(e.message)}}
$('f').onsubmit=e=>{e.preventDefault();const q=$('q').value.trim();if(!q)return;$('q').value='';add('u',md(q));send(q)};
$('q').onkeydown=e=>{if(e.key=='Enter'&&!e.shiftKey){e.preventDefault();$('f').requestSubmit()}};
</script></body></html>
